<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 334" width="868" height="334" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="From a piece of land to a living village: intake, discovery, analysis, and a page that reads it back.">
