<path d="M 0,0 l -7,-4 l 0,8 z" fill="#47574d" transform="translate(290.0,69.0) rotate(0.0)"/>
<path d="M 522.3,69.0 L 560.0,69.0" fill="none" stroke="#47574d" stroke-width="1.2"/>
<path d="M 0,0 l -7,-4 l 0,8 z" fill="#47574d" transform="translate(560.0,69.0) rotate(0.0)"/>
<path d="M 127.6,98.0 L 127.6,190.0" fill="none" stroke="#47574d" stroke-width="1.2" stroke-dasharray="2 3"/>
