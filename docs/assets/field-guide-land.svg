<text x="26.0" y="29.0" font-size="10" letter-spacing="1.6" fill="#74857a">INTAKE</text>
<rect x="276.0" y="14.0" width="260.3" height="98.0" rx="3" fill="#f5f7f3" stroke="#d6ddd2" stroke-dasharray="3 3"/>
<text x="286.0" y="29.0" font-size="10" letter-spacing="1.6" fill="#74857a">DISCOVERY</text>
<rect x="546.0" y="14.0" width="252.9" height="98.0" rx="3" fill="#f5f7f3" stroke="#d6ddd2" stroke-dasharray="3 3"/>
<text x="556.0" y="29.0" font-size="10" letter-spacing="1.6" fill="#74857a">ANALYSIS</text>
