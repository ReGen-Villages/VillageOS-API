<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 937 290" width="937" height="290" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="Three ways a value arrives, one durable record, and where each comes to rest.">
