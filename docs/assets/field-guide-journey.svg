<rect x="430.0" y="60.0" width="187.7" height="42.0" rx="2" fill="#ffffff" stroke="#d6ddd2"/>
<text x="523.8" y="77.0" font-size="12" font-weight="normal" fill="#47574d" text-anchor="middle">Write a durable record</text>
