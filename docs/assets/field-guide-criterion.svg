<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 826 190" width="826" height="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="A criterion taken apart, part by part.">
<rect width="826" height="190" fill="#ffffff"/>
<rect x="30" y="22" width="782" height="34" rx="2" fill="#e7ebe3" stroke="#d6ddd2"/>
<text x="40.0" y="44" font-size="14" fill="#46497e" xml:space="preserve">ANY </text>
<path d="M 57.4,52 V 74" stroke="#d6ddd2" fill="none"/>
<text x="27.4" y="90" font-size="11" fill="#74857a" text-anchor="start">quantifier: true if any</text>
<text x="27.4" y="103" font-size="11" fill="#74857a" text-anchor="start">related Thing satisfies it</text>
<text x="74.7" y="44" font-size="14" fill="#1f6047" xml:space="preserve">[feeds.Reservoir]</text>
<path d="M 148.5,52 V 124" stroke="#d6ddd2" fill="none"/>
<text x="148.5" y="140" font-size="11" fill="#74857a" text-anchor="middle">follow the feeds relationship;</text>
<text x="148.5" y="153" font-size="11" fill="#74857a" text-anchor="middle">keep only Reservoirs</text>
<text x="222.3" y="44" font-size="14" fill="#16201a" xml:space="preserve">.quantity</text>
<path d="M 261.3,52 V 74" stroke="#d6ddd2" fill="none"/>
<text x="261.3" y="90" font-size="11" fill="#74857a" text-anchor="middle">read their value</text>
<text x="300.4" y="44" font-size="14" fill="#74857a" xml:space="preserve"> &lt; </text>
<path d="M 313.4,52 V 124" stroke="#d6ddd2" fill="none"/>
<text x="313.4" y="140" font-size="11" fill="#74857a" text-anchor="middle">compare</text>
<text x="326.4" y="44" font-size="14" fill="#16201a" xml:space="preserve">capacityM3 * 0.2</text>
<path d="M 395.9,52 V 74" stroke="#d6ddd2" fill="none"/>
<text x="395.9" y="90" font-size="11" fill="#74857a" text-anchor="middle">arithmetic on this</text>
<text x="395.9" y="103" font-size="11" fill="#74857a" text-anchor="middle">Thing's own value</text>
<text x="465.3" y="44" font-size="14" fill="#46497e" xml:space="preserve"> AND </text>
<path d="M 487.0,52 V 124" stroke="#d6ddd2" fill="none"/>
<text x="487.0" y="140" font-size="11" fill="#74857a" text-anchor="middle">combine</text>
<text x="508.7" y="44" font-size="14" fill="#1f6047" xml:space="preserve">self.state NOT HAS 'Maintenance'</text>
<path d="M 647.6,52 V 74" stroke="#d6ddd2" fill="none"/>
<text x="687.6" y="90" font-size="11" fill="#74857a" text-anchor="end">ask about a state,</text>
<text x="687.6" y="103" font-size="11" fill="#74857a" text-anchor="end">own or across a relationship</text>
</svg>