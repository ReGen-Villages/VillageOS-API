[pytest]
# Two deprecations raised inside starlette's own test client, about the libraries it reaches for.
# Neither is answerable here: one is which HTTP client it prefers, the other is which anyio name it
# imports. Both go when starlette next moves. Our own code raises no warnings, so anything not
# listed here is ours and should fail the run rather than scroll past.
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
