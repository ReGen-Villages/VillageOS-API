# ============================================================
# Azure DevOps Pipeline for VillageOS Temporal Graph Database
# ============================================================
# This pipeline:
# - Triggers on all branch updates and pull requests
# - Builds the .NET 8 solution
# - Runs all 207 tests (Core, Application, Infrastructure)
# - Publishes test results and code coverage to Azure DevOps
# - Packages and publishes to NuGet (main branch only)
# ============================================================

trigger:
  branches:
    include:
      - '*'  # Trigger on all branches

pr:
  branches:
    include:
      - '*'  # Trigger on all pull requests

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  testResultsDirectory: '$(Agent.TempDirectory)/TestResults'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- script: dotnet tool install -g dotnet-reportgenerator-globaltool
  displayName: 'Install ReportGenerator'
  continueOnError: true

- script: dotnet restore
  displayName: 'Restore NuGet Packages'

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: 'Build Solution'

- task: DotNetCoreCLI@2
  displayName: 'Run Tests with Coverage'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory $(testResultsDirectory) --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura'
    publishTestResults: false

- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '$(testResultsDirectory)/**/*.trx'
    mergeTestResults: true
    failTaskOnFailedTests: true
    testRunTitle: 'VillageOS Tests - $(Build.SourceBranchName)'
  condition: always()

- task: PublishCodeCoverageResults@2
  displayName: 'Publish Code Coverage'
  inputs:
    codecoverageTool: 'Cobertura'
    summaryFileLocation: '$(testResultsDirectory)/**/coverage.cobertura.xml'
  condition: succeededOrFailed()

# Phase 3 / Task #5406 — per-assembly coverage gate. Logic + thresholds live in
# Tools/Test-CoverageGate.ps1 so the same command runs locally (`pwsh ...`) and in CI.
# See docs/TEST-STATE.md > "Coverage gate (Phase 3 / Task #5406)" for the design + how
# to raise a threshold or add a new assembly.
- task: PowerShell@2
  displayName: 'Coverage Gate (per-assembly no-regression)'
  condition: succeeded()
  inputs:
    filePath: 'Tools/Test-CoverageGate.ps1'
    arguments: '-Reports "$(testResultsDirectory)/**/coverage.cobertura.xml" -MergeOutput "$(testResultsDirectory)/coverage-report"'
    pwsh: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Coverage HTML Report'
  condition: succeededOrFailed()
  inputs:
    pathToPublish: '$(testResultsDirectory)/coverage-report'
    artifactName: 'coverage-report'

- script: |
    echo "========================================"
    echo "Build Summary for $(Build.SourceBranchName)"
    echo "========================================"
    echo "Build Number: $(Build.BuildNumber)"
    echo "Build ID: $(Build.BuildId)"
    echo "Repository: $(Build.Repository.Name)"
    echo "Commit: $(Build.SourceVersion)"
    echo "Triggered By: $(Build.RequestedFor)"
    echo "========================================"
  displayName: 'Build Summary'
  condition: always()

# --------------------------------------------
# ONLY RUN ON MAIN MERGE
# --------------------------------------------
- script: dotnet pack --configuration $(buildConfiguration) --no-build -o ./nupkgs
  displayName: 'Pack NuGet Package'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

- task: DotNetCoreCLI@2
  displayName: 'Push NuGet Package to Azure Artifacts'
  inputs:
    command: 'push'
    packagesToPush: 'nupkgs/*.nupkg'
    publishVstsFeed: 'NuGetPackages'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

# --------------------------------------------
# MIRROR TO GITHUB (develop and main only)
# --------------------------------------------
# Requires pipeline variable GITHUB_PAT (secret) — fine-grained PAT with
# Contents:Read+Write on regenrob/VillageOS-API, or a classic token with repo scope.
# Set in Azure DevOps > Pipelines > Edit > Variables
- bash: |
    git remote add github "https://x-access-token:${GITHUB_PAT}@github.com/regenrob/VillageOS-API.git" 2>/dev/null || true

    # Rewrite Azure DevOps wiki URLs → GitHub wiki URLs so the GitHub README
    # links to the GitHub wiki (the canonical README keeps DevOps links).
    sed -i'' \
      -e 's|https://dev.azure.com/ReGenVillages/VillageOS%20API/_wiki/wikis/VillageOS-API-Wiki/[0-9]*/|https://github.com/regenrob/VillageOS-API/wiki/|g' \
      -e 's|\[VillageOS\](https://dev.azure.com/ReGenVillages/VillageOS)|VillageOS|g' \
      -e 's|\[VillageOS API Wiki\](https://dev.azure.com/ReGenVillages/VillageOS%20API/_wiki)|[VillageOS API Wiki](https://github.com/regenrob/VillageOS-API/wiki)|g' \
      README.md
    git add README.md
    git -c user.name="Azure Pipelines" -c user.email="azuredevops@regenvillages.com" \
      commit -m "ci: rewrite wiki links for GitHub mirror" --allow-empty || true

    git push github "HEAD:$(Build.SourceBranchName)" --force
  displayName: 'Mirror to GitHub'
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
  env:
    GITHUB_PAT: $(GITHUB_PAT)

