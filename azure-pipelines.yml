# ============================================================
# Azure DevOps Pipeline for VillageOS Temporal Graph Database
# ============================================================
# This pipeline:
# - Triggers when develop or main moves, and when a branch policy validates a pull request
# - Builds the .NET solution
# - Runs the .NET test suite and the wiki-mirror converter tests
# - Lints, tests and builds Trellis, the GUI
# - Publishes test results and code coverage to Azure DevOps
# - Packages and publishes to NuGet (main branch only)
# - Mirrors the repo and the wiki to GitHub (develop and main only)
# ============================================================

# A feature branch is built when its pull request is validated and again after the merge; building
# every push as well took the pool's single agent a third time for a result nothing waits on.
trigger:
  branches:
    include:
      - develop
      - main

# Pull requests are still built: the branch policy on develop queues this pipeline itself, against
# the merge commit, and reads nothing here. Azure Repos ignores this block entirely — it applies
# only to a pipeline driven from GitHub.
pr: none

pool:
  name: 'Amsterdam'
  # The pool holds macOS agents only. Kept as a demand so that if a non-macOS agent is ever added,
  # jobs fail to match rather than running somewhere unverified.
  demands:
    - Agent.OS -equals Darwin

variables:
  buildConfiguration: 'Release'
  testResultsDirectory: '$(Agent.TempDirectory)/TestResults'
  # Azure DevOps project-wiki git repo id (from `az devops wiki list`). The wiki
  # is mirrored from here to the GitHub wiki on develop/main.
  wikiRepoId: 'de73fcdb-2959-4209-a858-f3d697e8c632'
  # pip reads this, and it sets where the downloaded packages are kept so the cache step below can
  # name that directory. It sits outside the sources directory, which the checkout empties.
  PIP_CACHE_DIR: '$(Pipeline.Workspace)/.pip'

steps:
# A self-hosted agent keeps its working directory between runs, so a stale file from an earlier
# build would otherwise still be here — including one the guard below is meant to catch.
- checkout: self
  clean: true

# Fail fast if proprietary engine code ever reappears in the public repo (it must not — the
# engine lives only in the private VillageOS repo). Runs before build AND before the GitHub
# mirror step (which is gated on succeeded()), so a violation can never be published.
- bash: |
    set -uo pipefail
    echo "Guard: verifying no proprietary engine code in the public repo..."
    fail=0
    for p in vos.Core vos.Application vos.Infrastructure vos.Mycelium vos.Persistence; do
      if [ -d "$p" ]; then echo "##[error]Forbidden engine project directory present: $p"; fail=1; fi
    done
    if grep -rIlE "vos\.(Core|Application|Infrastructure|Mycelium|Persistence)\.csproj" --include="*.csproj" . ; then
      echo "##[error]A .csproj references a proprietary engine project (paths above)"; fail=1; fi
    if grep -rIlE "using[[:space:]]+vos\.(Core|Application|Infrastructure|Mycelium|Persistence)" --include="*.cs" . ; then
      echo "##[error]Source imports a proprietary engine namespace (files above)"; fail=1; fi
    if [ "$fail" -ne 0 ]; then
      echo "##[error]Proprietary engine code must never exist in the public VillageOS-API repo. See the engine-exposure remediation."
      exit 1
    fi
    echo "Guard passed: no proprietary engine footprint."
  displayName: 'Guard: no proprietary engine in public repo'

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# Serves the wiki converters and the Trellis checks below. 22 rather than 20 because Vite asks for
# ^20.19 || >=22.12 — a 20.x line that resolved below 20.19 would fail the GUI build, and 22 is the
# version both Vite and Vitest name.
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '22.x'

- script: dotnet restore
  displayName: 'Restore NuGet Packages'

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: 'Build Solution'

# The solution rather than a wildcard over the test projects: a wildcard starts a separate test run
# per project, and each one loads the runner, starts a test host and waits for the previous project
# to finish. One run over the solution tests the projects alongside each other instead.
# maxcpucount caps how many projects test at once. The default is one per processor, which on a pool
# of one machine that is already short of memory at idle would start more test hosts than it can
# hold. Four costs no time, because the run lasts as long as its slowest single project either way.
- task: DotNetCoreCLI@2
  displayName: 'Run Tests with Coverage'
  inputs:
    command: 'test'
    projects: 'VillageOS-API.sln'
    arguments: '--configuration $(buildConfiguration) --no-build -maxcpucount:4 --logger trx --results-directory $(testResultsDirectory) --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura'
    publishTestResults: false

- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '$(testResultsDirectory)/**/*.trx'
    mergeTestResults: true
    failTaskOnFailedTests: true
    testRunTitle: 'VillageOS Tests - $(Build.SourceBranchName)'
  condition: always()

# Coverage for both stacks is published together, after the GUI tests have run. See the publish
# step below the Trellis steps.

# The four echo services are the worked examples of the managed-microservice contract in Go, Node,
# Python and Rust. Each ships a test suite, and until now the pipeline ran none of them, so all four
# could rot without anything reporting it. Each step runs even when an earlier one failed, so one
# build reports every broken example rather than one per push.
# The Amsterdam agents carry .NET, Node, Java and python3, and neither Go nor Rust, so the build
# brings those two itself. GoTool unpacks into the agent tool cache, so only the first build on a
# given agent pays the download.
- task: GoTool@0
  displayName: 'Install Go'
  inputs:
    version: '1.26'   # the version go.mod asks for
  condition: always()

- script: go test ./...
  displayName: 'Test Go echo service'
  workingDirectory: vos.Service.Go.Echo
  condition: always()

# Only devDependencies (TypeScript and the Node types); `npm test` compiles and then runs.
- script: |
    set -euo pipefail
    npm ci
    npm test
  displayName: 'Test Node echo service'
  workingDirectory: vos.Service.Node.Echo
  condition: always()

# Holds the packages pip downloads, so the install below reads them from disk instead of fetching
# them again. The virtual environment itself is deliberately not cached: it records the path and
# version of the interpreter that built it, so a macOS or Homebrew update to python3 would leave a
# restored one broken, and a red build is a bad trade for the seconds it would save.
- task: Cache@2
  displayName: 'Cache Python packages'
  inputs:
    key: 'pip | "$(Agent.OS)" | vos.Service.Python.Echo/requirements.txt'
    restoreKeys: |
      pip | "$(Agent.OS)"
    path: '$(PIP_CACHE_DIR)'
  condition: always()

# macOS ships no `python`, and its `python3` is externally managed, so pip refuses to install into
# it — this is the one step here with dependencies to install, hence the virtual environment.
- script: |
    set -euo pipefail
    python3 -m venv .venv
    .venv/bin/python -m pip install --upgrade pip
    .venv/bin/python -m pip install -r requirements.txt
    .venv/bin/python -m pytest
  displayName: 'Test Python echo service'
  workingDirectory: vos.Service.Python.Echo
  condition: always()

# There is no first-party Rust task, so rustup's own installer — skipped when an earlier build on
# this agent already ran it. prependpath puts cargo on PATH for the steps below; the registry
# location goes into a variable because the cache task cannot read a shell one.
- bash: |
    set -euo pipefail
    if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --no-modify-path --default-toolchain stable
    fi
    echo "##vso[task.prependpath]$HOME/.cargo/bin"
    echo "##vso[task.setvariable variable=cargoRegistry]$HOME/.cargo/registry"
  displayName: 'Install Rust'
  condition: always()

# Cargo builds axum, tokio and reqwest from source, which is the slowest step in the build. The
# cache keys on the lock file, so only a dependency change pays that cost again.
- task: Cache@2
  displayName: 'Cache Rust dependencies'
  inputs:
    key: 'cargo | "$(Agent.OS)" | vos.Service.Rust.Echo/Cargo.lock'
    restoreKeys: |
      cargo | "$(Agent.OS)"
    path: '$(cargoRegistry)'
  condition: always()

# The step above holds the downloaded source of the dependencies, which is not what costs the time —
# compiling it is, and that happened on every run. This holds the compiled output. It has to be a
# second task because a cache step takes one directory. The checkout removes untracked files, so the
# build directory does not survive a run on its own. Cargo checks the compiler version and rebuilds
# what a toolchain change invalidates, so a restored build directory cannot go stale unnoticed.
- task: Cache@2
  displayName: 'Cache Rust build output'
  inputs:
    key: 'cargo-target | "$(Agent.OS)" | vos.Service.Rust.Echo/Cargo.lock'
    restoreKeys: |
      cargo-target | "$(Agent.OS)"
    path: 'vos.Service.Rust.Echo/target'
  condition: always()

- script: cargo test
  displayName: 'Test Rust echo service'
  workingDirectory: vos.Service.Rust.Echo
  condition: always()

- script: node --test
  displayName: 'Test wiki-mirror converter'
  workingDirectory: tools/wiki-mirror
  condition: always()

# Also the guard against wiki drift: one of these tests fails when a markdown file is in
# neither list of tools/docs-to-wiki/wiki-map.json, so a new document forces the decision
# about whether it is published.
- script: node --test
  displayName: 'Test docs-to-wiki converter'
  workingDirectory: tools/docs-to-wiki
  condition: always()

# The Python tools each ship a unittest suite that no step ran, so the simulator, the layout
# importer and the playground generator could all break and merge green — and the first two share
# one Mycelium client, so a change to it can break the pair at once. Discovery rather than a named
# module, so a new test file is run by having been written. Stock Python: nothing to install.
- script: python3 -m unittest discover
  displayName: 'Test simulator'
  workingDirectory: tools/simulator
  condition: always()

- script: python3 -m unittest discover
  displayName: 'Test layout-importer'
  workingDirectory: tools/layout-importer
  condition: always()

- script: python3 -m unittest discover
  displayName: 'Test pipeline-playground'
  workingDirectory: tools/pipeline-playground
  condition: always()

# The GUI's own checks. Nothing here ran them until now, and both halves of that had been paying:
# lint errors accumulated across the pages, panels and hooks with nothing to fail (#6150), and the
# GUI test suite — the guard for the binding resolver, the property panels and the live-update path
# — had never gated a merge. Each step runs even when an earlier one failed, so one run reports
# every problem rather than one per push. They sit ahead of the mirror and the wiki publish, whose
# succeeded() conditions then stop a red GUI from being published.
- script: npm ci
  displayName: 'Install Trellis dependencies'
  workingDirectory: vos.Trellis
  condition: always()

- script: npm run lint
  displayName: 'Lint Trellis'
  workingDirectory: vos.Trellis
  condition: always()

# Both reporters: junit alone replaces the console output, which leaves a failing build's log
# saying only that the run exited 1, with the failures readable exclusively in the Tests tab.
# --coverage writes a cobertura report to vos.Trellis/coverage (configured in vite.config.ts).
# Without it the GUI figure was never measured, so it could fall a long way unnoticed while the
# platform figure looked healthy.
- script: npm run test -- --coverage --reporter=default --reporter=junit --outputFile.junit=$(testResultsDirectory)/trellis-junit.xml
  displayName: 'Test Trellis'
  workingDirectory: vos.Trellis
  condition: always()

- task: PublishTestResults@2
  displayName: 'Publish Trellis Test Results'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '$(testResultsDirectory)/trellis-junit.xml'
    testRunTitle: 'Trellis'
    mergeTestResults: true
    failTaskOnFailedTests: true
  condition: always()

# Both stacks in one report, so the GUI figure sits next to the platform figure instead of being
# invisible. Runs after the GUI tests because its report is one of the two being published.
- task: PublishCodeCoverageResults@2
  displayName: 'Publish Code Coverage'
  inputs:
    summaryFileLocation: |
      $(testResultsDirectory)/**/coverage.cobertura.xml
      $(Build.SourcesDirectory)/vos.Trellis/coverage/cobertura-coverage.xml
  condition: succeededOrFailed()

# Covers the type-check too — `npm run build` is `tsc -b` then the bundle, and nothing else in this
# pipeline type-checks the GUI. Emits to vos.Trellis/dist here: the output directory resolves to a
# sibling vos.Mycelium/wwwroot when one exists, and to dist when it does not.
- script: npm run build
  displayName: 'Build Trellis'
  workingDirectory: vos.Trellis
  condition: always()

- script: |
    echo "========================================"
    echo "Build Summary for $(Build.SourceBranchName)"
    echo "========================================"
    echo "Build Number: $(Build.BuildNumber)"
    echo "Build ID: $(Build.BuildId)"
    echo "Repository: $(Build.Repository.Name)"
    echo "Commit: $(Build.SourceVersion)"
    echo "Triggered By: $(Build.RequestedFor)"
    echo "========================================"
  displayName: 'Build Summary'
  condition: always()

# --------------------------------------------
# ONLY RUN ON MAIN MERGE
# --------------------------------------------
- script: dotnet pack --configuration $(buildConfiguration) --no-build -o ./nupkgs
  displayName: 'Pack NuGet Package'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

- task: DotNetCoreCLI@2
  displayName: 'Push NuGet Package to Azure Artifacts'
  inputs:
    command: 'push'
    packagesToPush: 'nupkgs/*.nupkg'
    publishVstsFeed: 'NuGetPackages'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

# --------------------------------------------
# MIRROR TO GITHUB (develop and main only)
# --------------------------------------------
# Requires pipeline variable GITHUB_PAT (secret) — fine-grained PAT with
# Contents:Read+Write on ReGen-Villages/VillageOS-API, or a classic token with repo scope.
# Set in Azure DevOps > Pipelines > Edit > Variables
- bash: |
    # Without this the step's exit code is the final git push's, so anything failing before it goes
    # unreported — which is how an unrewritten README reached the public mirror (#6367).
    set -euo pipefail
    git remote add github "https://x-access-token:${GITHUB_PAT}@github.com/ReGen-Villages/VillageOS-API.git" 2>/dev/null || true

    # Rewrite Azure DevOps wiki URLs → GitHub wiki URLs so the GitHub README
    # links to the GitHub wiki (the canonical README keeps DevOps links).
    # The canonical README uses the ID-stable pagePath form
    # (.../VillageOS-API-Wiki?pagePath=%2FPage); the page name maps to the
    # GitHub wiki slug. The wiki-root link and the VillageOS project link are
    # rewritten by exact match. Keep these patterns in sync with README.md.
    # Written through a temporary file rather than edited in place: `sed -i` means "no backup" to
    # GNU sed and "the next argument is the backup extension" to the BSD sed macOS ships, and the
    # agents are macOS.
    sed \
      -e 's|https://dev.azure.com/ReGenVillages/VillageOS-API/_wiki/wikis/VillageOS-API-Wiki?pagePath=%2F\([^)]*\)|https://github.com/ReGen-Villages/VillageOS-API/wiki/\1|g' \
      -e 's|\[VillageOS\](https://dev.azure.com/ReGenVillages/VillageOS)|VillageOS|g' \
      -e 's|\[VillageOS API Wiki\](https://dev.azure.com/ReGenVillages/VillageOS-API/_wiki)|[VillageOS API Wiki](https://github.com/ReGen-Villages/VillageOS-API/wiki)|g' \
      README.md > "$AGENT_TEMPDIRECTORY/README.mirror.md"
    mv "$AGENT_TEMPDIRECTORY/README.mirror.md" README.md
    git add README.md
    git -c user.name="Azure Pipelines" -c user.email="azuredevops@regenvillages.com" \
      commit -m "ci: rewrite wiki links for GitHub mirror" --allow-empty || true

    # Fully-qualified ref so the first push to a freshly (re)created empty repo works —
    # a short ref (HEAD:develop) only resolves when the branch already exists on the remote.
    git push github "HEAD:refs/heads/$(Build.SourceBranchName)" --force
  displayName: 'Mirror to GitHub'
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
  env:
    GITHUB_PAT: $(GITHUB_PAT)

# --------------------------------------------
# PUBLISH DOCS TO THE PROJECT WIKI (develop only)
# --------------------------------------------
# The repository is the source of truth for the wiki: tools/docs-to-wiki generates every page
# from a document listed in its manifest. This runs before the GitHub mirror below, so a single
# build carries a documentation change from the merge all the way to the public GitHub wiki.
#
# Prerequisite: AZURE_DEVOPS_PAT needs the Wiki scope, Read & Write. Publishing goes through the
# wiki REST API rather than git precisely so that is enough: a project wiki is a git repository,
# so pushing to it needs the Code scope, which on a classic token means write access to every
# repository in the organisation — far more than publishing a wiki should carry. The mirror step
# below still clones the wiki, which is what its Code: Read covers.
#
# Pages absent from the manifest are removed rather than left behind. Wiki history keeps every
# version, and a page whose content already matches is left untouched so a build that changes no
# documentation adds no revisions.
- bash: |
    set -euo pipefail
    OUT="$AGENT_TEMPDIRECTORY/wiki-generated"
    node tools/docs-to-wiki/docs-to-wiki.js "$(Build.SourcesDirectory)" "$OUT"
    node tools/docs-to-wiki/publish-wiki.js "$OUT"
  displayName: 'Publish Docs to Wiki'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  env:
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)

# --------------------------------------------
# MIRROR WIKI TO GITHUB (develop and main only)
# --------------------------------------------
# Repopulates the GitHub wiki from the canonical Azure DevOps project wiki,
# converting every DevOps-specific link to its GitHub target (see
# tools/wiki-mirror/sync-wiki.js). Without this the GitHub README's wiki links
# 404 because the GitHub wiki is never populated.
#
# Prerequisites (one-time):
#   - GitHub: enable Wikis in repo Settings → Features (creates the .wiki.git repo).
#   - AZURE_DEVOPS_PAT (secret pipeline variable): a PAT with Code:Read used to
#     clone the canonical project wiki. System.AccessToken can NOT be used here:
#     the project has "Protect access to repositories in YAML pipelines"
#     (enforceReferencedRepoScopedToken), which scopes the build token to only
#     checked-out repos — the wiki isn't one, so it returns TF401019. A PAT
#     bypasses that scoping. Declaring the wiki as a repository resource does NOT
#     extend the scoped token (verified), and a `checkout: wiki` step would remap
#     the self-repo source dir and break the build (Bug #5525).
#   - GITHUB_PAT: classic token with repo scope (covers both the repo push and the
#     wiki push; fine-grained PATs cannot reliably push to GitHub wikis).
- bash: |
    set -euo pipefail
    SRC="$AGENT_TEMPDIRECTORY/devops-wiki"
    OUT="$AGENT_TEMPDIRECTORY/wiki-out"
    DEST="$AGENT_TEMPDIRECTORY/github-wiki"
    WIKI_URL="https://x-access-token:${GITHUB_PAT}@github.com/ReGen-Villages/VillageOS-API.wiki.git"

    # 1. Clone the canonical Azure DevOps project wiki using AZURE_DEVOPS_PAT.
    #    System.AccessToken is scoped to checked-out repos only and the wiki is
    #    not one, so it returns TF401019; a PAT bypasses that scoping (Bug #5525).
    rm -rf "$SRC"
    AZDO_AUTH=$(printf ':%s' "$AZURE_DEVOPS_PAT" | base64 | tr -d '\n')
    git -c http.extraheader="Authorization: Basic ${AZDO_AUTH}" \
      clone --depth 1 \
      "https://dev.azure.com/ReGenVillages/VillageOS-API/_git/$(wikiRepoId)" "$SRC"

    # 2. Convert DevOps wiki -> GitHub wiki content.
    node tools/wiki-mirror/sync-wiki.js "$SRC" "$OUT"

    # 3. Clone the GitHub wiki (or init if the .wiki.git is empty).
    rm -rf "$DEST"
    git clone "$WIKI_URL" "$DEST" || {
      mkdir -p "$DEST"
      git -C "$DEST" init -q
      git -C "$DEST" remote add origin "$WIKI_URL"
    }

    # 4. Replace all pages with the freshly converted content.
    find "$DEST" -maxdepth 1 -name '*.md' -delete
    cp "$OUT"/*.md "$DEST"/

    # 5. Commit and push (GitHub wikis use the master branch).
    git -C "$DEST" add -A
    git -C "$DEST" -c user.name="Azure Pipelines" -c user.email="azuredevops@regenvillages.com" \
      commit -m "ci: sync wiki from Azure DevOps" || { echo "No wiki changes."; exit 0; }
    git -C "$DEST" push origin HEAD:refs/heads/master --force
  displayName: 'Mirror Wiki to GitHub'
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
  env:
    GITHUB_PAT: $(GITHUB_PAT)
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)

