# ============================================================
# Azure DevOps Pipeline for VillageOS Temporal Graph Database
# ============================================================
# This pipeline:
# - Triggers on all branch updates and pull requests
# - Builds the .NET solution
# - Runs the .NET test suite and the wiki-mirror converter tests
# - Publishes test results and code coverage to Azure DevOps
# - Packages and publishes to NuGet (main branch only)
# - Mirrors the repo and the wiki to GitHub (develop and main only)
# ============================================================

trigger:
  branches:
    include:
      - '*'  # Trigger on all branches

pr:
  branches:
    include:
      - '*'  # Trigger on all pull requests

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  testResultsDirectory: '$(Agent.TempDirectory)/TestResults'
  # Azure DevOps project-wiki git repo id (from `az devops wiki list`). The wiki
  # is mirrored from here to the GitHub wiki on develop/main.
  wikiRepoId: 'de73fcdb-2959-4209-a858-f3d697e8c632'

steps:
# Fail fast if proprietary engine code ever reappears in the public repo (it must not — the
# engine lives only in the private VillageOS repo). Runs before build AND before the GitHub
# mirror step (which is gated on succeeded()), so a violation can never be published.
- bash: |
    set -uo pipefail
    echo "Guard: verifying no proprietary engine code in the public repo..."
    fail=0
    for p in vos.Core vos.Application vos.Infrastructure vos.Mycelium vos.Persistence; do
      if [ -d "$p" ]; then echo "##[error]Forbidden engine project directory present: $p"; fail=1; fi
    done
    if grep -rIlE "vos\.(Core|Application|Infrastructure|Mycelium|Persistence)\.csproj" --include="*.csproj" . ; then
      echo "##[error]A .csproj references a proprietary engine project (paths above)"; fail=1; fi
    if grep -rIlE "using[[:space:]]+vos\.(Core|Application|Infrastructure|Mycelium|Persistence)" --include="*.cs" . ; then
      echo "##[error]Source imports a proprietary engine namespace (files above)"; fail=1; fi
    if [ "$fail" -ne 0 ]; then
      echo "##[error]Proprietary engine code must never exist in the public VillageOS-API repo. See the engine-exposure remediation."
      exit 1
    fi
    echo "Guard passed: no proprietary engine footprint."
  displayName: 'Guard: no proprietary engine in public repo'

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: NodeTool@0
  displayName: 'Install Node.js (for wiki-mirror converter)'
  inputs:
    versionSpec: '20.x'

- script: dotnet restore
  displayName: 'Restore NuGet Packages'

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: 'Build Solution'

- task: DotNetCoreCLI@2
  displayName: 'Run Tests with Coverage'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory $(testResultsDirectory) --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura'
    publishTestResults: false

- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '$(testResultsDirectory)/**/*.trx'
    mergeTestResults: true
    failTaskOnFailedTests: true
    testRunTitle: 'VillageOS Tests - $(Build.SourceBranchName)'
  condition: always()

- task: PublishCodeCoverageResults@2
  displayName: 'Publish Code Coverage'
  inputs:
    codecoverageTool: 'Cobertura'
    summaryFileLocation: '$(testResultsDirectory)/**/coverage.cobertura.xml'
  condition: succeededOrFailed()

- script: node --test
  displayName: 'Test wiki-mirror converter'
  workingDirectory: tools/wiki-mirror
  condition: always()

# Also the guard against wiki drift: one of these tests fails when a markdown file is in
# neither list of tools/docs-to-wiki/wiki-map.json, so a new document forces the decision
# about whether it is published.
- script: node --test
  displayName: 'Test docs-to-wiki converter'
  workingDirectory: tools/docs-to-wiki
  condition: always()

- script: |
    echo "========================================"
    echo "Build Summary for $(Build.SourceBranchName)"
    echo "========================================"
    echo "Build Number: $(Build.BuildNumber)"
    echo "Build ID: $(Build.BuildId)"
    echo "Repository: $(Build.Repository.Name)"
    echo "Commit: $(Build.SourceVersion)"
    echo "Triggered By: $(Build.RequestedFor)"
    echo "========================================"
  displayName: 'Build Summary'
  condition: always()

# --------------------------------------------
# ONLY RUN ON MAIN MERGE
# --------------------------------------------
- script: dotnet pack --configuration $(buildConfiguration) --no-build -o ./nupkgs
  displayName: 'Pack NuGet Package'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

- task: DotNetCoreCLI@2
  displayName: 'Push NuGet Package to Azure Artifacts'
  inputs:
    command: 'push'
    packagesToPush: 'nupkgs/*.nupkg'
    publishVstsFeed: 'NuGetPackages'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

# --------------------------------------------
# MIRROR TO GITHUB (develop and main only)
# --------------------------------------------
# Requires pipeline variable GITHUB_PAT (secret) — fine-grained PAT with
# Contents:Read+Write on ReGen-Villages/VillageOS-API, or a classic token with repo scope.
# Set in Azure DevOps > Pipelines > Edit > Variables
- bash: |
    git remote add github "https://x-access-token:${GITHUB_PAT}@github.com/ReGen-Villages/VillageOS-API.git" 2>/dev/null || true

    # Rewrite Azure DevOps wiki URLs → GitHub wiki URLs so the GitHub README
    # links to the GitHub wiki (the canonical README keeps DevOps links).
    # The canonical README uses the ID-stable pagePath form
    # (.../VillageOS-API-Wiki?pagePath=%2FPage); the page name maps to the
    # GitHub wiki slug. The wiki-root link and the VillageOS project link are
    # rewritten by exact match. Keep these patterns in sync with README.md.
    sed -i'' \
      -e 's|https://dev.azure.com/ReGenVillages/VillageOS-API/_wiki/wikis/VillageOS-API-Wiki?pagePath=%2F\([^)]*\)|https://github.com/ReGen-Villages/VillageOS-API/wiki/\1|g' \
      -e 's|\[VillageOS\](https://dev.azure.com/ReGenVillages/VillageOS)|VillageOS|g' \
      -e 's|\[VillageOS API Wiki\](https://dev.azure.com/ReGenVillages/VillageOS-API/_wiki)|[VillageOS API Wiki](https://github.com/ReGen-Villages/VillageOS-API/wiki)|g' \
      README.md
    git add README.md
    git -c user.name="Azure Pipelines" -c user.email="azuredevops@regenvillages.com" \
      commit -m "ci: rewrite wiki links for GitHub mirror" --allow-empty || true

    # Fully-qualified ref so the first push to a freshly (re)created empty repo works —
    # a short ref (HEAD:develop) only resolves when the branch already exists on the remote.
    git push github "HEAD:refs/heads/$(Build.SourceBranchName)" --force
  displayName: 'Mirror to GitHub'
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
  env:
    GITHUB_PAT: $(GITHUB_PAT)

# --------------------------------------------
# PUBLISH DOCS TO THE PROJECT WIKI (develop only)
# --------------------------------------------
# The repository is the source of truth for the wiki: tools/docs-to-wiki generates every page
# from a document listed in its manifest. This runs before the GitHub mirror below, so a single
# build carries a documentation change from the merge all the way to the public GitHub wiki.
#
# Prerequisite: AZURE_DEVOPS_PAT needs Code: Read & Write. The mirror step below only reads the
# wiki, so before this existed the PAT needed Read alone.
#
# Pages are replaced wholesale rather than updated in place, so a page whose document was
# removed from the manifest disappears instead of lingering. Wiki history keeps every version.
- bash: |
    set -euo pipefail
    OUT="$AGENT_TEMPDIRECTORY/wiki-generated"
    WIKI="$AGENT_TEMPDIRECTORY/project-wiki"

    node tools/docs-to-wiki/docs-to-wiki.js "$(Build.SourcesDirectory)" "$OUT"

    rm -rf "$WIKI"
    AZDO_AUTH=$(printf ':%s' "$AZURE_DEVOPS_PAT" | base64 | tr -d '\n')
    git -c http.extraheader="Authorization: Basic ${AZDO_AUTH}" \
      clone "https://dev.azure.com/ReGenVillages/VillageOS-API/_git/$(wikiRepoId)" "$WIKI"

    find "$WIKI" -path "$WIKI/.git" -prune -o \( -name '*.md' -o -name '.order' \) -print -delete
    cp -R "$OUT"/. "$WIKI"/

    git -C "$WIKI" add -A
    git -C "$WIKI" -c user.name="Azure Pipelines" -c user.email="azuredevops@regenvillages.com" \
      commit -m "docs: publish wiki from $(Build.SourceVersion)" || { echo "No wiki changes."; exit 0; }
    # A project wiki lives on wikiMaster, not master.
    git -C "$WIKI" -c http.extraheader="Authorization: Basic ${AZDO_AUTH}" push origin HEAD:wikiMaster
  displayName: 'Publish Docs to Wiki'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  env:
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)

# --------------------------------------------
# MIRROR WIKI TO GITHUB (develop and main only)
# --------------------------------------------
# Repopulates the GitHub wiki from the canonical Azure DevOps project wiki,
# converting every DevOps-specific link to its GitHub target (see
# tools/wiki-mirror/sync-wiki.js). Without this the GitHub README's wiki links
# 404 because the GitHub wiki is never populated.
#
# Prerequisites (one-time):
#   - GitHub: enable Wikis in repo Settings → Features (creates the .wiki.git repo).
#   - AZURE_DEVOPS_PAT (secret pipeline variable): a PAT with Code:Read used to
#     clone the canonical project wiki. System.AccessToken can NOT be used here:
#     the project has "Protect access to repositories in YAML pipelines"
#     (enforceReferencedRepoScopedToken), which scopes the build token to only
#     checked-out repos — the wiki isn't one, so it returns TF401019. A PAT
#     bypasses that scoping. Declaring the wiki as a repository resource does NOT
#     extend the scoped token (verified), and a `checkout: wiki` step would remap
#     the self-repo source dir and break the build (Bug #5525).
#   - GITHUB_PAT: classic token with repo scope (covers both the repo push and the
#     wiki push; fine-grained PATs cannot reliably push to GitHub wikis).
- bash: |
    set -euo pipefail
    SRC="$AGENT_TEMPDIRECTORY/devops-wiki"
    OUT="$AGENT_TEMPDIRECTORY/wiki-out"
    DEST="$AGENT_TEMPDIRECTORY/github-wiki"
    WIKI_URL="https://x-access-token:${GITHUB_PAT}@github.com/ReGen-Villages/VillageOS-API.wiki.git"

    # 1. Clone the canonical Azure DevOps project wiki using AZURE_DEVOPS_PAT.
    #    System.AccessToken is scoped to checked-out repos only and the wiki is
    #    not one, so it returns TF401019; a PAT bypasses that scoping (Bug #5525).
    rm -rf "$SRC"
    AZDO_AUTH=$(printf ':%s' "$AZURE_DEVOPS_PAT" | base64 | tr -d '\n')
    git -c http.extraheader="Authorization: Basic ${AZDO_AUTH}" \
      clone --depth 1 \
      "https://dev.azure.com/ReGenVillages/VillageOS-API/_git/$(wikiRepoId)" "$SRC"

    # 2. Convert DevOps wiki -> GitHub wiki content.
    node tools/wiki-mirror/sync-wiki.js "$SRC" "$OUT"

    # 3. Clone the GitHub wiki (or init if the .wiki.git is empty).
    rm -rf "$DEST"
    git clone "$WIKI_URL" "$DEST" || {
      mkdir -p "$DEST"
      git -C "$DEST" init -q
      git -C "$DEST" remote add origin "$WIKI_URL"
    }

    # 4. Replace all pages with the freshly converted content.
    find "$DEST" -maxdepth 1 -name '*.md' -delete
    cp "$OUT"/*.md "$DEST"/

    # 5. Commit and push (GitHub wikis use the master branch).
    git -C "$DEST" add -A
    git -C "$DEST" -c user.name="Azure Pipelines" -c user.email="azuredevops@regenvillages.com" \
      commit -m "ci: sync wiki from Azure DevOps" || { echo "No wiki changes."; exit 0; }
    git -C "$DEST" push origin HEAD:refs/heads/master --force
  displayName: 'Mirror Wiki to GitHub'
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
  env:
    GITHUB_PAT: $(GITHUB_PAT)
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)

