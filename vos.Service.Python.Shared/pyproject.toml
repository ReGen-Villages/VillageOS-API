[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vos-service"
version = "1.0.0"
description = "The VillageOS managed-microservice contract for Python services: arguments, inbound JWT validation, registration, and the standard endpoints."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[tool.setuptools]
packages = ["vos_service"]
